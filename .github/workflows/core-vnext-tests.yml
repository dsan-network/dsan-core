name: core-vnext-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dsan/core_vnext/**'
      - 'fixtures/core_vnext/**'
      - 'tests/test_core_vnext_*.py'
      - 'pyproject.toml'
      - '.github/workflows/core-vnext-tests.yml'
  pull_request:
    paths:
      - 'dsan/core_vnext/**'
      - 'fixtures/core_vnext/**'
      - 'tests/test_core_vnext_*.py'
      - 'pyproject.toml'
      - '.github/workflows/core-vnext-tests.yml'

jobs:
  core-vnext-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Core-vNext package
        run: python -m pip install .
      - name: Verify installed namespace
        run: python -c "from dsan.core_vnext import project_accountable_history, LEDGER_PROTOCOL; assert LEDGER_PROTOCOL == 'dsan:execution-ledger:alpha04:1'; assert callable(project_accountable_history)"
      - name: Run Core-vNext interoperability tests
        run: python -m unittest discover -s tests -p 'test_core_vnext_*.py' -v
