name: core-vnext-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dsan/core_vnext/**'
      - 'fixtures/core_vnext/**'
      - 'tests/test_core_vnext_*.py'
      - 'pyproject.toml'
      - '.github/workflows/core-vnext-tests.yml'
  pull_request:
    paths:
      - 'dsan/core_vnext/**'
      - 'fixtures/core_vnext/**'
      - 'tests/test_core_vnext_*.py'
      - 'pyproject.toml'
      - '.github/workflows/core-vnext-tests.yml'

jobs:
  core-vnext-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Core-vNext package
        run: python -m pip install .
      - name: Verify installed namespace and contract
        run: >-
          python -c "from dsan.core_vnext import API_VERSION, PACKAGE_VERSION, LEDGER_PROTOCOL, core_vnext_contract, project_accountable_history;
          c=core_vnext_contract();
          assert API_VERSION == '1.0';
          assert PACKAGE_VERSION == '0.2.0a2';
          assert c.api_version == API_VERSION;
          assert 'execution-ledger.policy-lifecycle/1' in c.features;
          assert LEDGER_PROTOCOL in c.protocols;
          assert callable(project_accountable_history)"
      - name: Run Core-vNext interoperability tests
        run: python -m unittest discover -s tests -p 'test_core_vnext_*.py' -v
