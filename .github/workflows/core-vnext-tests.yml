name: core-vnext-tests

on:
  push:
    branches: [main]
    paths:
      - 'dsan/core_vnext/**'
      - 'fixtures/core_vnext/**'
      - 'tests/test_core_vnext_*.py'
      - '.github/workflows/core-vnext-tests.yml'
  pull_request:
    paths:
      - 'dsan/core_vnext/**'
      - 'fixtures/core_vnext/**'
      - 'tests/test_core_vnext_*.py'
      - '.github/workflows/core-vnext-tests.yml'

jobs:
  core-vnext-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Core-vNext interoperability tests
        run: python -m unittest discover -s tests -p 'test_core_vnext_*.py' -v
